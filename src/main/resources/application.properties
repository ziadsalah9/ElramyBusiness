spring.application.name=MafroshartElramyz
server.port=8090
# No profile is forced here. Local development opts in with
# SPRING_PROFILES_ACTIVE=dev (see application-dev.properties); a forced
# dev profile would silently give production the dev JWT secret.

# Run the security filter chain on REQUEST/ASYNC dispatches only.
# Leaving ERROR in the list makes the authentication entry point
# intercept the internal forward to /error, which rewrites the real
# error status (e.g. a 400 validation failure) into a 401 and hides it
# from the client.
spring.security.filter.dispatcher-types=request,async


# ==============================================================
# DATABASE
# --------------------------------------------------------------
# Default = local Docker Postgres from docker-compose.yml
#   docker compose up -d
#   (postgres/postgres on 5432, database "ElramyGroup")
# Override with env vars if needed, e.g.
#   export DB_URL=jdbc:postgresql://localhost:5432/ElramyGroup
# ==============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ElramyGroup}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==============================================================
# JPA / HIBERNATE
# ==============================================================

# Flyway owns the schema; Hibernate only checks that the entities match.
# (The dev profile relaxes this to "update".)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep SQL out of the logs in production; enable only for local debugging.
spring.jpa.show-sql=false


# ==============================================================
# FLYWAY (schema hardening migrations)
# --------------------------------------------------------------
# Flyway baselines the existing schema on first run, then applies the
# constraint/index migrations in db/migration.
# ==============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration


# ==============================================================
# JWT
# --------------------------------------------------------------
# jwt.secret MUST come from the JWT_SECRET environment variable.
# There is deliberately NO default value: a missing secret fails
# startup instead of silently forging tokens with a known key.
# ==============================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Excel imports (products, purchase invoices); the service enforces 5MB itself.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
